# Render Blueprint for the static site. Using the dashboard instead? Copy these values:
# Build Command: npm ci && npm run build    Publish Directory: out
services:
  - type: web
    name: portfolio
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set this to the site's real address so canonical URLs, Open Graph and the sitemap point to it.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # Optional, server-side at build time only: raises GitHub's rate limit for the telemetry section.
      - key: GITHUB_TOKEN
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
